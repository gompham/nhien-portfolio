/* HOOKS */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(&quot;.reveal:not(.is-visible)&quot;);
    if (!els.length) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add(&quot;is-visible&quot;);
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: &quot;0px 0px -40px 0px&quot; }
    );
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  });
}

function useScrollY() {
  const [y, setY] = useState(0);
  useEffect(() => {
    const onScroll = () => setY(window.scrollY);
    window.addEventListener(&quot;scroll&quot;, onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener(&quot;scroll&quot;, onScroll);
  }, []);
  return y;
}

/* PRIMITIVES */
const Reveal = ({ as: Tag = &quot;div&quot;, delay = 0, className = &quot;&quot;, style = {}, children, ...rest }) => (
  <Tag
    className={`reveal ${className}`}
    style={{ transitionDelay: `${delay}ms`, ...style }}
    {...rest}>
    {children}
  </Tag>
);

const SectionLabel = ({ children, className = &quot;&quot; }) => (
  <div className={`text-[0.7rem] font-medium uppercase text-fog-600 ${className}`}
       style={{ letterSpacing: &quot;0.18em&quot; }}>
    {children}
  </div>
);

const SectionHeading = ({ children, className = &quot;&quot; }) => (
  <h2
    className={`text-3xl md:text-[2.5rem] font-semibold text-white ${className}`}
    style={{ letterSpacing: &quot;-0.02em&quot;, lineHeight: 1.1 }}>
    {children}
  </h2>
);

const PrimaryButton = ({ children, onClick, type = &quot;button&quot;, className = &quot;&quot; }) => (
  <button
    type={type}
    onClick={onClick}
    className={`group inline-flex items-center gap-3 bg-white text-ink-950 px-7 py-3.5 text-sm font-medium uppercase border border-white hover:bg-transparent hover:text-white transition-colors duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white ${className}`}
    style={{ letterSpacing: &quot;0.12em&quot; }}>
    <span>{children}</span>
    <IconArrowRight size={16} className=&quot;transition-transform duration-300 group-hover:translate-x-1&quot; />
  </button>
);

const OutlineButton = ({ children, onClick, className = &quot;&quot; }) => (
  <button
    type=&quot;button&quot;
    onClick={onClick}
    className={`group inline-flex items-center gap-3 bg-transparent text-white px-7 py-3.5 text-sm font-medium uppercase border border-ink-700 hover:border-white hover:bg-white hover:text-ink-950 transition-colors duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white ${className}`}
    style={{ letterSpacing: &quot;0.12em&quot; }}>
    <span>{children}</span>
    <IconArrowRight size={16} className=&quot;transition-transform duration-300 group-hover:translate-x-1&quot; />
  </button>
);

const TextLink = ({ children, onClick, className = &quot;&quot; }) => (
  <button
    type=&quot;button&quot;
    onClick={onClick}
    className={`group inline-flex items-center gap-2 text-white text-sm font-medium uppercase ${className}`}
    style={{ letterSpacing: &quot;0.12em&quot; }}>
    <span className=&quot;nav-underline pb-1&quot;>{children}</span>
    <IconArrowRight size={14} className=&quot;transition-transform duration-300 group-hover:translate-x-1&quot; />
  </button>
);

/* NAVBAR */
const Navbar = ({ currentPage, navigate, mobileOpen, setMobileOpen }) => {
  const scrollY = useScrollY();
  const scrolled = scrollY > 16;
  return (
    <>
      <header
        className={`fixed inset-x-0 top-0 z-50 backdrop-blur-md bg-ink-950/80 transition-colors duration-300 ${
          scrolled ? &quot;border-b border-ink-800&quot; : &quot;border-b border-transparent&quot;
        }`}>
        <div className=&quot;max-w-7xl mx-auto px-6 lg:px-10 h-16 md:h-20 flex items-center justify-between&quot;>
          <button
            onClick={() => navigate(&quot;home&quot;)}
            className=&quot;text-white text-sm md:text-[0.95rem] font-bold uppercase&quot;
            style={{ letterSpacing: &quot;0.18em&quot; }}
            aria-label=&quot;Home&quot;>
            HẠO NHIÊN
          </button>

          {/* Desktop nav */}
          <nav className=&quot;hidden md:flex items-center gap-10&quot;>
            {NAV_ITEMS.map((item) => {
              const active = currentPage === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => navigate(item.id)}
                  className={`nav-underline pb-1 text-[0.85rem] font-medium uppercase transition-colors duration-200 ${
                    active ? &quot;text-white is-active&quot; : &quot;text-fog-600 hover:text-white&quot;
                  }`}
                  style={{ letterSpacing: &quot;0.14em&quot; }}>
                  {item.label}
                </button>
              );
            })}
          </nav>

          {/* Mobile toggle */}
          <button
            onClick={() => setMobileOpen(true)}
            className=&quot;md:hidden text-white&quot;
            aria-label=&quot;Open menu&quot;>
            <IconMenu size={22} />
          </button>
        </div>
      </header>

      {/* Mobile overlay */}
      {mobileOpen &amp;&amp; (
        <div className=&quot;fixed inset-0 z-[60] bg-ink-950 md:hidden&quot;>
          <div className=&quot;h-16 px-6 flex items-center justify-between border-b border-ink-800&quot;>
            <span className=&quot;text-white text-sm font-bold uppercase&quot; style={{ letterSpacing: &quot;0.18em&quot; }}>
              HẠO NHIÊN
            </span>
            <button onClick={() => setMobileOpen(false)} className=&quot;text-white&quot; aria-label=&quot;Close menu&quot;>
              <IconX size={22} />
            </button>
          </div>
          <nav className=&quot;flex flex-col items-center justify-center gap-8 px-6&quot; style={{ minHeight: &quot;calc(100vh - 4rem)&quot; }}>
            {NAV_ITEMS.map((item, i) => {
              const active = currentPage === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    navigate(item.id);
                    setMobileOpen(false);
                  }}
                  className={`menu-item text-3xl font-semibold uppercase ${
                    active ? &quot;text-white&quot; : &quot;text-fog-600&quot;
                  }`}
                  style={{ letterSpacing: &quot;0.06em&quot;, animationDelay: `${i * 80 + 80}ms` }}>
                  {item.label}
                </button>
              );
            })}
          </nav>
        </div>
      )}
    </>
  );
};

const ProjectCard = ({ project }) => {

    return m ? m[1] : null;
  })();
  const thumb = ytId ? `https://i.ytimg.com/vi/${ytId}/maxresdefault.jpg` : null;
  const externalUrl = project.youtubeUrl || project.frameioUrl || project.link;

  return (
    <div className=&quot;filter-card group block&quot;>

/* APP */
function App() {
  const [currentPage, setCurrentPage] = useState(&quot;home&quot;);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [transitioning, setTransitioning] = useState(false);

  const navigate = useCallback(
    (page) => {
      if (page === currentPage) {
        window.scrollTo({ top: 0, behavior: &quot;smooth&quot; });
        return;
      }
      setTransitioning(true);
      setTimeout(() => {
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: &quot;auto&quot; });
        setTransitioning(false);
      }, 250);
    },
    [currentPage]
  );

  useScrollReveal();
  useEffect(() => {
    requestAnimationFrame(() => {
      const els = document.querySelectorAll(&quot;.reveal&quot;);
      els.forEach((el) => el.classList.remove(&quot;is-visible&quot;));
    });
  }, [currentPage]);

  return (
    <div className=&quot;stage min-h-screen bg-ink-950 text-white selection:bg-white selection:text-ink-950&quot;>
      <Navbar
        currentPage={currentPage}
        navigate={navigate}
        mobileOpen={mobileOpen}
        setMobileOpen={setMobileOpen} />
      <main
        className={`transition-opacity duration-300 ease-out ${
          transitioning ? &quot;opacity-0&quot; : &quot;opacity-100&quot;
        }`}>
        {currentPage === &quot;home&quot; &amp;&amp; <HomePage navigate={navigate} />}
        {currentPage === &quot;about&quot; &amp;&amp; <AboutPage navigate={navigate} />}
        {currentPage === &quot;contact&quot; &amp;&amp; <ContactPage />}
      </main>
      <Footer navigate={navigate} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById(&quot;root&quot;));
root.render(<App />);
